# fun.cloudbsd.cat — origin nginx snippet (FreeBSD jail)
# server_name is this host only. Do not add other names.
#
# Origin :80 serves these static files. Public HTTPS is Cloudflare orange-cloud
# (proxied) in front of this origin. Do not issue HTTP-01 while DNS is orange-cloud
# / proxied; HTTP-01 only works when A/AAAA are DNS-only (grey cloud) pointing at
# this jail.

server {
    listen       80;
    listen       [::]:80;
    server_name  fun.cloudbsd.cat;

    root         /usr/local/www/fun.cloudbsd.cat;
    index        index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # WOFF2 is same-origin; CORS Access-Control-Allow-Origin is not needed.
    location /fonts/ {
        types { font/woff2 woff2; }
        default_type font/woff2;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /css/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
