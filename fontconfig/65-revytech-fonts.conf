<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- REVYTECH font collection: Noto for Latin; pIqaD qolqoS for CSUR U+F8D0-U+F8FF;
     Alcarin Tengwar for CSUR-based U+E000 range. FreeBSD fontconfig first. -->
<fontconfig>
  <description>REVYTECH font collection selection</description>

  <!-- Prefer Noto Sans / Mono for generic Latin families -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>pIqaD qolqoS</family>
      <family>Alcarin Tengwar</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Alcarin Tengwar</family>
      <family>pIqaD qolqoS</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>pIqaD qolqoS</family>
    </prefer>
  </alias>

  <!-- tlhIngan Hol: select pIqaD qolqoS (HaSta is display-only; do not steal default) -->
  <match target="pattern">
    <test name="lang">
      <string>tlh</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>pIqaD qolqoS</string>
    </edit>
  </match>

  <!-- When the requested charset includes Klingon CSUR PUA, prepend qolqoS -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <int>0xF8D0</int>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>pIqaD qolqoS</string>
    </edit>
  </match>

  <!-- When the requested charset includes tengwar PUA, prepend Alcarin -->
  <match target="pattern">
    <test name="charset" compare="contains">
      <charset>
        <int>0xE000</int>
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Alcarin Tengwar</string>
    </edit>
  </match>

  <!-- Quenya -->
  <match target="pattern">
    <test name="lang">
      <string>qya</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Alcarin Tengwar</string>
    </edit>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans</string>
    </edit>
  </match>
</fontconfig>
